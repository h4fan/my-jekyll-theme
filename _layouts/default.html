<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  {% seo %}
 
  <meta name="author" content="{{ site.author }}">
  <meta name="keywords" content="{{ site.keywords | default: 'web sec,bug bounty,pen test' }}">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <link rel="stylesheet" href="{{ '/assets/css/redesign.css' | relative_url }}">

  
  {% if site.social-network-links.rss %}
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  {% endif %}
</head>
<body>
  <div class="site-wrapper">
    {% include sidebar.html %}
    <main class="main-content">
      {{ content }}
    </main>
  </div>
  
  <footer class="site-footer">
    <div class="footer-inner">
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.author }} &nbsp;·&nbsp; 基于 <a href="https://beautifuljekyll.com">Beautiful Jekyll</a> 重新设计</p>
    </div>
  </footer>
</body>
</html>
